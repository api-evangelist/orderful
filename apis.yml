aid: orderful
name: Orderful
description: >-
  Orderful is a modern B2B trading and EDI platform that lets companies connect once to
  transact with any partner in their supply chain without building custom integrations. Its
  Mosaic API turns X12 and EDIFACT electronic data interchange into simple JSON, handling
  mapping, validation, testing, and compliance so suppliers, retailers, 3PLs, and carriers
  can exchange purchase orders (850), acknowledgments (855), ship notices (856), invoices
  (810), inventory advices (846), warehouse (940-series) and other transaction sets over a
  REST API, HTTP webhooks, AS2, SFTP, and VAN. The platform advertises 10,000+ trading
  partners, 50M+ transactions, and 99.99% network uptime, with US and EU regional data
  residency, Web EDI (Pixel), and GS1 UCC-128 shipping labels.
