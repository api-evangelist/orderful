  /v3/labels:
    post:
      operationId: LabelController_generate
      summary: Generate Label
      description: 'Generates a PDF or ZPL file to be used for label printing. For more information, see the <a href="https://docs.orderful.com/docs/generate-shipping-label"
        target="_blank">Create a Label guide</a>. Supports single label or batch generation.

        '
      tags:
      - Label
      parameters:
      - name: orderful-api-key
        in: header
        required: true
        description: Your Orderful API key.
        schema:
          type: string
      - name: skipValidation
        in: query
        required: false
        description: Skip validation.
        schema:
          type: boolean
      - name: format
        in: query
        required: false
        description: Output format for the label.
        schema:
          type: string
          enum:
          - zpl
          - pdf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/GenerateLabelRequestBodyDto'
                title: Single Label
              - type: array
                items:
                  $ref: '#/components/schemas/GenerateLabelRequestBodyDto'
                title: Batch Labels
      responses:
        '201':
          description: Label generated successfully.
          content:
            application/json:
              schema:
                oneOf:
                - type: string
                  description: ZPL label content.
                  title: ZPL
                - type: string
                  format: binary
                  description: PDF label content.
                  title: PDF
  /v3/organizations/me:
    get:
      operationId: OrganizationV3Controller_getOwn
      summary: Get your Organization details
      description: Retrieves the Organization information for the current user.
      tags:
      - Organization
      parameters:
      - name: orderful-api-key
        in: header
        required: true
        description: Your Orderful API key.
        schema:
          type: string
      responses:
        '200':
          description: Organization details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationMeResponseV3'
  /v3/polling-buckets/{id}/confirm-retrieval:
    post:
      operationId: PollingController_confirmDelivery
      summary: Remove a set of Transactions from a Bucket
      description: Orderful will soon deprecate this endpoint. After retrieving Transactions from a Polling Bucket, you should
        use the Delivery API to mark a Delivery as <a href="https://docs.orderful.com/reference/deliverycontroller_handledeliveryapproved"
        target="_blank">Approved</a> or <a href="https://docs.orderful.com/reference/deliverycontroller_handlefaildeliveryrequest"
        target="_blank">Failed</a>. This will automatically remove the Transaction from the Bucket.
      deprecated: true
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDeliveryItems'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmDeliveryResponse'
      tags:
      - Poller
      security:
      - API_KEY: []
  /v3/polling-buckets/{bucketId}:
    get:
      operationId: PollingController_list
      summary: Get Transactions from Poller Bucket
      description: Retrieves the Transactions from the specified Poller Bucket.
      parameters:
      - name: bucketId
        required: true
        in: path
        schema:
          type: number
      - name: limit
        required: false
        in: query
        description: Value can be `1-100`. Default value is `30`. **Note:** Response size is limited to 200MB. We will return
          the maximum number of transactions possible without exceeding either the specified `limit` or the maximum response
          size.
        schema:
          maximum: 100
          type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PollingDeliveryResponseDto'
      tags:
      - Poller
      security:
      - API_KEY: []
  /v3/relationships:
    get:
      operationId: RelationshipController_listV3
      summary: List Relationships
      description: 'Retrieves a paginated list of the Relationships for the current Organization.

        '
      tags:
      - Relationship
      parameters:
      - name: orderful-api-key
        in: header
        required: true
        description: Your Orderful API key.
        schema:
          type: string
      - name: autoSend
        in: query
        required: false
        description: Filter by the relationship auto-send configuration.
        schema:
          type: string
          enum:
          - ENABLED
          - DISABLED
      - name: limit
        in: query
        required: false
        description: The number of items to return in the result set.
        schema:
          type: integer
          maximum: 100
      - name: prevCursor
        in: query
        required: false
        description: 'If results are <a href="https://docs.orderful.com/reference/pagination" target="_blank">paginated</a>,
          this will point to the previous set of results.

          '
        schema:
          type: string
      - name: nextCursor
        in: query
        required: false
        description: 'If results are <a href="https://docs.orderful.com/reference/pagination" target="_blank">paginated</a>,
          this will point to the next set of results.

          '
        schema:
          type: string
      responses:
        '200':
          description: List of relationships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRelationshipsResponseV3Dto'
