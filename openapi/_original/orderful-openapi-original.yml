      - errorMessage
      - outputPath
      properties:
        payloadPaths:
          description: Path in the original payload where the error occurred.
          nullable: true
          type: array
          items:
            type: string
        errorMessage:
          type: string
          description: Error message describing the validation failure.
        outputPath:
          type: string
          description: Path in the output/transformed message where the error occurred.
    GetTransactionDeliveryResponseDto:
      type: object
      required:
      - deliveryId
      - transactionId
      - href
      - status
      - createdAt
      - lastUpdatedAt
      - note
      - approve
      - fail
      - sendSucceededAt
      - sendFailedAt
      - lastConfirmedAt
      properties:
        deliveryId:
          type: string
          description: Delivery ID
          example: 1aadf1a68-abcd-4981-abcd-012345678901
        transactionId:
          type: number
          description: Transaction ID
          example: 0
        href:
          type: string
          description: Delivery URL
          example: https://api.orderful.com/transactions/00000/deliveries/1aadf1a68-abcd-4981-abcd-012345678901
        status:
          type: string
          description: Delivery status
          example: CREATED
          enum:
          - CREATED
          - SENT
          - FAILED
          - DELIVERED
        createdAt:
          type: string
          format: date-time
          description: Datetime the delivery was created
          example: '2025-10-02T16:46:11.943Z'
        lastUpdatedAt:
          type: string
          format: date-time
          description: Datetime the delivery was last updated
          example: '2025-10-02T16:46:11.943Z'
        note:
          type: string
          description: Delivery note
          example: Transaction received by the ERP
        approve:
          description: Approve delivery
          example:
            href: https://api.orderful.com/transactions/00000/deliveries/1aadf1a68-abcd-4981-abcd-012345678901/approve
          allOf:
          - $ref: '#/components/schemas/HrefLink'
        fail:
          description: Fail delivery
          example:
            href: https://api.orderful.com/transactions/00000/deliveries/1aadf1a68-abcd-4981-abcd-012345678901/fail
          allOf:
          - $ref: '#/components/schemas/HrefLink'
        sendSucceededAt:
          type: string
          format: date-time
          description: Datetime the delivery was successfully sent
          example: '2025-10-02T16:46:11.943Z'
        sendFailedAt:
          type: string
          format: date-time
          description: Datetime the delivery permanently failed to be sent
          example: '2025-10-02T16:46:11.943Z'
        lastConfirmedAt:
          type: string
          format: date-time
          description: Datetime the delivery was failed or approved
          example: '2025-10-02T16:46:11.943Z'
