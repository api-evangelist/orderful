  /transactions/{transactionId}/deliveries/{deliveryId}:
    get:
      operationId: TransactionController_getDelivery
      summary: Get a Delivery.
      description: Returns the specified transaction delivery. Links to Delivery objects are available in Transactions retrieved
        from a <a href="https://docs.orderful.com/reference/pollingcontroller_list" target="_blank">Inbox</a> or via an <a
        href="https://docs.orderful.com/docs/inbound-http" target="_blank">Inbound HTTP Communication Channel</a>.
      tags:
      - Transaction
      parameters:
      - name: transactionId
        required: true
        in: path
        schema:
          type: number
      - name: deliveryId
        required: true
        in: path
        schema:
          type: string
      - name: orderful-api-version
        in: header
        description: Specifies the API version to use.
        schema:
          type: string
          default: v4
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionDeliveryResponseDto'
  /transactions/{transactionId}/deliveries/{deliveryId}/accept:
    post:
      operationId: TransactionController_handleDeliveryApproved
      summary: Accept a transaction delivery.
      description: Accepts the specified transaction delivery. This link is included when a Transaction is retrieved from
        a <a href="https://docs.orderful.com/reference/inboxcontroller_list" target="_blank">Inbox</a> or via an <a href="https://docs.orderful.com/docs/inbound-http"
        target="_blank">Inbound HTTP Communication Channel</a>.If this Delivery is the most recent one associated with a Transaction,
        this will update the Transaction's `deliveryStatus` to `DELIVERED`.If this Delivery is associated with one or more
        Transactions in a inbox, this will also remove the Transactions from that inbox.
      tags:
      - Transaction
      parameters:
      - name: transactionId
        required: true
        in: path
        schema:
          type: number
      - name: deliveryId
        required: true
        in: path
        schema:
          type: string
      - name: orderful-api-version
        in: header
        description: Specifies the API version to use.
        schema:
          type: string
          default: v4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveTransactionDeliveryRequestV4Dto'
      responses:
        '200':
          description: Transaction delivery marked as accepted.
  /transactions/{transactionId}/deliveries/{deliveryId}/fail:
    post:
      operationId: TransactionController_handleFailDeliveryRequest
      summary: Fail a transaction delivery.
      description: 'Fails the specified transaction delivery. This link is included when a Transaction is retrieved from a
        <a href="https://docs.orderful.com/reference/pollingcontroller_list" target="_blank">Inbox</a> or via an <a href="https://docs.orderful.com/docs/inbound-http"
        target="_blank">Inbound HTTP Communication Channel</a>.


        If this Delivery is the most recent one associated with a Transaction, this will update the Transaction''s `deliveryStatus`
        to `FAILED`.


        If this Delivery is associated with one or more Transactions in a inbox, this will also remove the Transactions from
        that inbox.

        '
      tags:
      - Transaction
      parameters:
      - name: transactionId
        required: true
        in: path
        schema:
          type: number
      - name: deliveryId
        required: true
        in: path
        schema:
          type: string
      - name: orderful-api-version
        in: header
        description: Specifies the API version to use.
        schema:
          type: string
          default: v4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailTransactionDeliveryRequestV4Dto'
      responses:
        '200':
          description: Transaction marked as failed.
  /v3/transactions/{transactionId}/acknowledgment:
    post:
      operationId: TransactionControllerV3_acknowledgeTransaction
      summary: Create an Acknowledgment
      description: Creates an acknowledgment with the specified status for the specified Transaction.
      tags:
      - Transaction (v3)
      parameters:
      - name: orderful-api-key
        in: header
        required: true
        description: Your Orderful API key.
        schema:
          type: string
      - name: transactionId
        in: path
        required: true
        description: The numeric transaction ID.
        schema:
          type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTransactionAcknowledgmentRequestDto'
      responses:
        '201':
          description: Acknowledgment created successfully.
    get:
      operationId: TransactionControllerV3_getAcknowledgment
      summary: Get an Acknowledgment
      description: Returns the acknowledgment for the specified Transaction.
      tags:
      - Transaction (v3)
      parameters:
      - name: orderful-api-key
        in: header
        required: true
        description: Your Orderful API key.
        schema:
          type: string
      - name: transactionId
        in: path
        required: true
        description: The numeric transaction ID.
        schema:
          type: number
      responses:
        '200':
          description: Acknowledgment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionAcknowledgmentResponseV3Dto'
        '404':
          description: Transaction or acknowledgment not found.
  /v3/transactions/confirm-delivery:
    post:
      operationId: TransactionControllerV3_confirmDelivery
      summary: Confirm the delivery of a set of Transactions
      description: Orderful will soon deprecate this endpoint. After retrieving Transactions from a Polling Bucket, you should
        use the Delivery API to mark a Delivery as <a href="https://docs.orderful.com/reference/deliverycontroller_handledeliveryapproved"
        target="_blank">Approved</a> or <a href="https://docs.orderful.com/reference/deliverycontroller_handlefaildeliveryrequest"
        target="_blank">Failed</a>. This will automatically remove the Transaction from the Bucket.
      deprecated: true
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BatchConfirmDeliveryBody'
      responses:
        '200':
          description: The confirmation batch was successfully processed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                example:
                  '12345': Successfully confirmed failed delivery for transaction 12345
                  '99999': Transaction ID 99999 not found
                  '988765': Successfully confirmed delivery for transaction 988765
                  NO_OP: Transaction ID NO_OP not found
      tags:
      - Transaction (v3)
      security:
      - API_KEY: []
  /v3/transactions:
    post:
      operationId: TransactionControllerV3_create
      summary: Create a Transaction
      description: 'Creates a Transaction using the v3 API format. Either a `message` or `summary` must be provided, but not
        both. For guidance on how to use this endpoint, see the <a href="https://docs.orderful.com/docs/create-a-transaction"
        target="_blank">Create a Transaction guide</a>.

        '
      tags:
      - Transaction (v3)
      parameters:
      - name: orderful-api-key
        in: header
        required: true
        description: Your Orderful API key.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionBodyV3'
      responses:
        '201':
          description: Transaction created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTransactionResponseV3'
        '400':
          description: Invalid request body.
        '403':
          description: Insufficient permissions.
    get:
      operationId: TransactionControllerV3_list
      summary: List Transactions
      description: 'Returns an array of Transactions sorted in descending order by their creation date. A maximum of 100 Transactions
        will be returned at a time.

        '
      tags:
      - Transaction (v3)
      parameters:
      - name: orderful-api-key
        in: header
        required: true
        description: Your Orderful API key.
        schema:
          type: string
      - name: prevCursor
        in: query
        required: false
        description: 'If results are <a href="https://docs.orderful.com/reference/pagination" target="_blank">paginated</a>,
          this will point to the previous set of results.

          '
        schema:
          type: string
      - name: nextCursor
        in: query
        required: false
        description: 'If results are <a href="https://docs.orderful.com/reference/pagination" target="_blank">paginated</a>,
          this will point to the next set of results.

          '
        schema:
          type: string
      - name: createdAt
        in: query
        required: false
        description: 'The date and time that the Transactions were created on or before, in ISO-8601 format. This is used
          to <a href="https://docs.orderful.com/reference/filtering" target="_blank">filter results</a>.

          '
        schema:
          type: string
      - name: stream
        in: query
        required: false
        description: Indicates whether you want results from the Test and/or Live stream.
        schema:
          type: array
          items:
            type: string
            enum:
            - TEST
            - LIVE
      - name: businessNumber
        in: query
        required: false
        description: 'Indicates which business number(s) you would like to list Transactions from. You may indicate up to
          5 business numbers.

          '
        schema:
          type: array
          maxItems: 5
          items:
            type: string
      - name: transactionType
        in: query
        required: false
        description: 'Indicates the Transaction Type(s) you would like to filter by. You may indicate up to 5 <a href="https://docs.orderful.com/reference/available-transaction-types"
          target="_blank">Transaction Types</a>.

          '
        schema:
          type: array
          maxItems: 5
          items:
            type: string
      - name: validationStatus
        in: query
        required: false
        description: The one or more validation status(es) you would like to filter by.
        schema:
          type: array
          items:
            type: string
            enum:
            - PROCESSING
            - VALID
            - INVALID
      - name: deliveryStatus
        in: query
        required: false
        description: The one or more delivery status(es) you would like to filter by.
        schema:
          type: array
          items:
            type: string
            enum:
            - PENDING
            - SENT
            - DELIVERED
            - FAILED
      - name: acknowledgmentStatus
        in: query
        required: false
        description: The one or more acknowledgment status(es) you would like to filter by.
        schema:
          type: array
          items:
            type: string
            enum:
            - NOT_ACKNOWLEDGED
            - ACCEPTED
            - REJECTED
            - OVERDUE
            - ACCEPTED_WITH_ERRORS
      - name: senderIsaId
        in: query
        required: false
        description: 'The Sender ISA ID(s) that you would like to list Transactions from. You may indicate up to 5 Sender
          ISA IDs.

          '
        schema:
          type: array
          maxItems: 5
          items:
            type: string
      - name: receiverIsaId
        in: query
        required: false
        description: 'The Receiver ISA ID(s) that you would like to list Transactions from. You may indicate up to 5 Receiver
          ISA IDs.

          '
        schema:
          type: array
          maxItems: 5
          items:
            type: string
      - name: referenceIdentifier
        in: query
        required: false
        description: Reference Identifier Value you would like to filter by.
        schema:
          type: string
      - name: senderInterchangeReferenceIdentifier
        in: query
        required: false
        description: Sender's Interchange Reference Identifier Value you would like to filter by.
        schema:
          type: string
      - name: senderGroupReferenceIdentifier
        in: query
        required: false
        description: Sender's (Functional) Group Reference Identifier Value you would like to filter by.
        schema:
          type: string
      - name: senderTransactionReferenceIdentifier
        in: query
        required: false
        description: Sender's Transaction Reference Identifier Value you would like to filter by.
        schema:
          type: string
      - name: receiverInterchangeReferenceIdentifier
        in: query
        required: false
        description: Receiver's Interchange Reference Identifier Value you would like to filter by.
        schema:
          type: string
      - name: receiverGroupReferenceIdentifier
        in: query
        required: false
        description: Receiver's (Functional) Group Reference Identifier Value you would like to filter by.
        schema:
          type: string
      - name: receiverTransactionReferenceIdentifier
        in: query
        required: false
        description: Receiver's Transaction Reference Identifier Value you would like to filter by.
        schema:
          type: string
      responses:
        '200':
          description: List of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponseV3Dto'
  /v3/transactions/raw:
    post:
      operationId: TransactionControllerV3_createRaw
      summary: Create a raw Transaction
      description: 'Creates a Transaction from a raw document. The request body should contain the raw document content (e.g.
        X12, XML, CSV). Routing metadata is provided via request headers rather than in the body.


        > 🚧 Try It! playground limitation

        >

        > The in-page **Try It!** playground on this reference can only exercise `application/json` request bodies. If you
        are testing or experimenting with `application/xml`, `text/xml`, `text/csv`, `application/pdf`, `image/jpeg`, or `text/plain`
        payloads, use cURL or an HTTP client such as Postman for your ad-hoc requests. Your production integration is unaffected
        — this applies only to the in-browser Try It! tool. The endpoint itself accepts every supported content type from
        any HTTP client.'
      parameters:
      - name: orderful-business-number
        in: header
        description: A business reference number for the Transaction.
        required: true
        schema:
          type: string
      - name: orderful-stream
        in: header
        description: The stream for the Transaction.
        required: true
        schema:
          type: string
          enum:
          - test
          - live
      - name: orderful-transaction-type
        in: header
        description: The Transaction Type name.
        required: true
        schema:
          type: string
      - name: orderful-receiver-id
        in: header
        description: The ISA ID of the receiver.
        required: true
        schema:
          type: string
      - name: orderful-sender-id
        in: header
        description: The ISA ID of the sender.
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'The content type of the raw document. Supported types: `application/json`, `application/xml`, `text/xml`,
          `text/csv`, `application/pdf`, `image/jpeg`, `text/plain`.'
        required: true
        schema:
          type: string
          enum:
          - application/json
          - application/xml
          - text/xml
          - text/csv
          - application/pdf
          - image/jpeg
          - text/plain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: json
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTransactionResponseV3'
      tags:
      - Transaction (v3)
      security:
      - API_KEY: []
  /v3/transactions/{transactionId}:
    get:
      operationId: TransactionControllerV3_getById
      summary: Get a Transaction
      description: Returns the specified Transaction.
      tags:
      - Transaction (v3)
      parameters:
      - name: orderful-api-key
        in: header
        required: true
        description: Your Orderful API key.
        schema:
          type: string
      - name: transactionId
        in: path
        required: true
        description: The numeric transaction ID.
        schema:
          type: number
      - name: expand
        in: query
        required: false
        description: 'This optional parameter will embed the specified object into the return payload.

          '
        schema:
          type: string
          enum:
          - message
      responses:
        '200':
          description: Transaction details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionV3Dto'
        '404':
          description: Transaction not found.
  /v3/transactions/{transactionId}/message:
    get:
      operationId: TransactionControllerV3_getMessage
      summary: Get a Transaction Message
      description: Returns the specified Transaction's message content.
      tags:
      - Transaction (v3)
      parameters:
      - name: orderful-api-key
        in: header
        required: true
        description: Your Orderful API key.
        schema:
          type: string
      - name: transactionId
        in: path
        required: true
        description: The numeric transaction ID.
        schema:
          type: number
      responses:
        '200':
          description: Transaction message content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionMessageWithContentV3Dto'
        '404':
          description: Transaction not found.
components:
  schemas:
    ApproveDeliveryRequestDto:
      type: object
      properties:
        note:
          type: string
    FailDeliveryRequestDto:
      type: object
      properties:
        note:
          type: string
    InboxTransactionsResponseDto:
      type: object
      description: Transaction retrieved from an inbox.
      required:
      - integrationPayloadId
      - transactionId
      - senderId
      - receiverId
      - stream
      - message
      - delivery
      properties:
        integrationPayloadId:
          type: string
          format: uuid
          description: Unique identifier for this integration payload.
          example: 019be412-5a85-714c-8ba6-436c1c06efd8
        transactionId:
          type: integer
          description: Transaction ID.
          example: 802210971
        senderId:
          type: string
          description: Sender ISA ID.
          example: MosaicNT
        receiverId:
          type: string
          description: Receiver ISA ID.
          example: MosaicDemo
        stream:
          type: string
          description: Environment stream.
          enum:
          - test
          - live
          example: test
        message:
          description: Transaction document. Structure depends on the transaction type.
          oneOf:
          - $ref: '#/components/schemas/850_PURCHASE_ORDER'
          - $ref: '#/components/schemas/855_PURCHASE_ORDER_ACKNOWLEDGMENT'
          - $ref: '#/components/schemas/856_SHIP_NOTICE_MANIFEST'
          - $ref: '#/components/schemas/810_INVOICE'
          - $ref: '#/components/schemas/846_INVENTORY_ADVICE'
          - $ref: '#/components/schemas/860_PURCHASE_ORDER_CHANGE'
        delivery:
          $ref: '#/components/schemas/InboxDelivery'
    InboxDelivery:
      type: object
      description: Delivery information with action links.
      required:
      - deliveryId
      - transactionId
      - href
      - approve
      - fail
      properties:
        deliveryId:
          type: string
          format: uuid
          description: Delivery ID.
          example: b646771e-a068-4e32-832f-e96f895c5ec9
        transactionId:
          type: integer
          description: Transaction ID.
          example: 802210971
        href:
          type: string
          format: uri
          description: URL to retrieve delivery details.
          example: https://api.orderful.com/transactions/802210971/deliveries/b646771e-a068-4e32-832f-e96f895c5ec9
        approve:
          $ref: '#/components/schemas/HrefLink'
        fail:
          $ref: '#/components/schemas/HrefLink'
    HrefLink:
      type: object
      required:
      - href
      properties:
        href:
          type: string
    850_PURCHASE_ORDER:
      type: object
      description: Purchase Order document - Buyer sends order to supplier.
      properties:
        purpose:
          type: string
          description: REQUIRED. Transaction purpose (BEG01).
          enum:
          - original
          - cancellation
          - change
          - replace
          - confirmation
        purchaseOrderType:
          type: string
          description: REQUIRED. PO type (BEG02).
          enum:
          - blanketEstimated
          - blanketFirm
          - dropship
          - release
          - rushOrder
          - standalone
        purchaseOrderNumber:
          type: string
          description: REQUIRED. Unique PO number (BEG03).
        purchaseOrderDate:
          type: string
          format: date
          description: REQUIRED. PO issue date (BEG05).
        contractNumber:
          type: string
          description: Contract number (BEG06).
        releaseNumber:
          type: string
          description: Release number for blanket orders (BEG04).
        acknowledgmentType:
          type: string
          description: Acknowledgment request type.
        parties:
          $ref: '#/components/schemas/Parties'
        dates:
          $ref: '#/components/schemas/Dates'
        references:
          $ref: '#/components/schemas/References'
        termsOfSale:
          $ref: '#/components/schemas/TermsOfSale'
        carrierDetails:
          $ref: '#/components/schemas/CarrierDetails'
        notes:
          $ref: '#/components/schemas/Notes'
        monetaryAmounts:
          $ref: '#/components/schemas/HeaderMonetaryAmounts'
        conditionsAndRestrictions:
          type: array
          items:
            $ref: '#/components/schemas/Conditions'
        lineItems:
          type: array
          description: REQUIRED. Order line items (PO1 loop).
          minItems: 1
          items:
            $ref: '#/components/schemas/POLineItem'
    855_PURCHASE_ORDER_ACKNOWLEDGMENT:
      type: object
      description: Purchase Order Acknowledgment document - Supplier confirms or rejects order.
      properties:
        purchaseOrderNumber:
          type: string
          description: REQUIRED. Original PO number being acknowledged (BAK03).
        status:
          type: string
          description: REQUIRED. Overall acknowledgment status (BAK02).
          enum:
          - accepted
          - rejected
        statusReasonCode:
          type: string
          description: Reason code for status.
          enum:
          - discontinued
          - invalidAddress
          - invalidBillToCode
          - invalidItemNumber
          - invalidPrice
          - invalidItemQuantity
          - invalidShipFrom
          - invalidShipMethod
          - invalidShipToName
          - invalidShipToAddress1
          - invalidShipToAddress2
          - invalidShipToCity
          - invalidShipToStateOrProvince
          - invalidShipToPostalCode
          - invalidShipToCountry
          - itemRecall
          - itemSetupIssue
          - mainlandOnly
          - missingLineItemId
          - missingOrderId
          - missingShipId
          - naturalDisaster
          - outOfStock
          - seasonalOrEndOfLife
          - shippingInFull
          - systemIssue
          - taxNexusIssue
          - transportationIssuePrepaid
          - transportationIssueCollect
          - undeliverableAddress
          - weather
        statusNote:
          $ref: '#/components/schemas/NoteDetail'
        dates:
          $ref: '#/components/schemas/POAckDates'
        parties:
          type: object
          properties:
            shipFrom:
              $ref: '#/components/schemas/Party'
            supplier:
              $ref: '#/components/schemas/Party'
        termsOfSale:
          $ref: '#/components/schemas/TermsOfSale'
        lineItems:
          type: array
