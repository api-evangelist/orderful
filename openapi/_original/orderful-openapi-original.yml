openapi: 3.0.0
info:
  title: Orderful API
  description: The official Orderful API documentation.
  version: 2.15.0
  contact:
    name: Orderful
    url: https://orderful.com
    email: developers@orderful.com
  termsOfService: https://orderful.com/terms-and-conditions/
servers:
- url: https://api.orderful.com
tags:
- name: Conversion
  description: Convert data between EDI X12 and JSON formats.
- name: Delivery
  description: Approve or fail transaction deliveries.
- name: Inbox
  description: Retrieve transactions from inboxes.
- name: Label
  description: Generate UCC-128 shipping labels.
- name: Organization
  description: Retrieve organization information.
- name: Poller
  description: Retrieve and confirm transactions from polling buckets.
- name: Relationship
  description: Manage trading partner relationships.
- name: Transaction
  description: Create and manage EDI transactions.
- name: Transaction (v3)
  description: Create and manage EDI transactions using the v3 API.
paths:
  /v3/convert:
    post:
      operationId: ConversionController_convertData
      summary: Convert Data Between Formats
      description: This endpoint will convert JSON into X12, or X12 into JSON. Set the "Content-Type" header as the format
        you are sending, and the "Accept" header as the format you would like to receive back.
      tags:
      - Conversion
      parameters:
      - name: orderful-api-key
        in: header
        required: true
        description: Your Orderful API key.
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/edi-x12
          - application/json
      - name: Accept
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/edi-x12
          - application/json
      requestBody:
        required: true
        content:
          application/edi-x12:
            schema:
              type: string
              format: blob
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Data converted successfully.
          content:
            application/json:
              schema:
                type: object
            application/edi-x12:
              schema:
                type: string
  /v3/deliveries/{deliveryId}/approve:
    post:
      operationId: DeliveryController_handleDeliveryApproved
      summary: Approve a Delivery
      description: "Approves the specified Delivery. This link is included when a Transaction is retrieved from a <a href=\"\
        https://docs.orderful.com/reference/pollingcontroller_list\" target=\"_blank\">Poller Bucket</a> or via an <a href=\"\
        https://docs.orderful.com/docs/inbound-http\" target=\"_blank\">Inbound HTTP Communication Channel</a>. \n\nIf this\
        \ Delivery is the most recent one associated with a Transaction, this will update the Transaction's `deliveryStatus`\
        \ to `DELIVERED`.\n\nIf this Delivery is associated with one or more Transactions in a Poller Bucket, this will also\
        \ remove the Transactions from that Bucket."
      parameters:
      - name: deliveryId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveDeliveryRequestDto'
      responses:
        '200':
          description: ''
      tags:
      - Delivery
      security:
      - API_KEY: []
  /v3/deliveries/{deliveryId}/fail:
    post:
      operationId: DeliveryController_handleFailDeliveryRequest
      summary: Fail a Delivery
      description: "Fails the specified Delivery. This link is included when a Transaction is retrieved from a <a href=\"\
        https://docs.orderful.com/reference/pollingcontroller_list\" target=\"_blank\">Poller Bucket</a> or via an <a href=\"\
        https://docs.orderful.com/docs/inbound-http\" target=\"_blank\">Inbound HTTP Communication Channel</a>. \n\nIf this\
        \ Delivery is the most recent one associated with a Transaction, this will update the Transaction's `deliveryStatus`\
        \ to `FAILED`.\n\nIf this Delivery is associated with one or more Transactions in a Poller Bucket, this will also\
        \ remove the Transactions from that Bucket."
      parameters:
      - name: deliveryId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailDeliveryRequestDto'
      responses:
        '200':
          description: ''
      tags:
      - Delivery
      security:
      - API_KEY: []
  /inboxes/{inboxId}/transactions:
    get:
      operationId: InboxController_list
      summary: Inbox
      description: 'Retrieves the Transactions from the specified Inbox.


        **Note:** The `inboxId` can be found by logging in to [ui.orderful.com](https://ui.orderful.com) and navigating to
        "Communication Channels".

        '
      tags:
      - Inbox
      parameters:
      - name: inboxId
        required: true
        in: path
        schema:
          type: number
      - name: limit
        required: false
        in: query
        description: Value can be `1-100`. Default value is `30`. **Note:** Response size is limited to 200MB. We will return
          the maximum number of transactions possible without exceeding either the specified `limit` or the maximum response
          size.
        schema:
          type: number
      - name: orderful-api-version
        in: header
        description: Specifies the API version to use.
        schema:
          type: string
          default: v4
      responses:
        '200':
          description: Transactions retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InboxTransactionsResponseDto'
