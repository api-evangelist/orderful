      type: object
      required:
      - type
      - stream
      - message
      - senderId
      - receiverId
      properties:
        type:
          type: string
          description: The type of Transaction to be created. Please refer to our <a href="https://docs.orderful.com/reference/available-transaction-types"
            target="_blank">list of available Transaction Types</a>.
          enum:
          - 850_PURCHASE_ORDER
          - 855_PURCHASE_ORDER_ACKNOWLEDGMENT
          - 856_SHIP_NOTICE_MANIFEST
          - 810_INVOICE
          - 846_INVENTORY_ADVICE
          - 860_PURCHASE_ORDER_CHANGE
          example: 850_PURCHASE_ORDER
        stream:
          type: string
          description: Name of stream to create the transaction on.
          enum:
          - test
          - live
          example: test
          default: test
        senderId:
          type: string
          description: Sender identifier.
        receiverId:
          type: string
          description: Receiver identifier.
        message:
          description: Transaction document in the structure defined by the specified type.
          oneOf:
          - $ref: '#/components/schemas/850_PURCHASE_ORDER'
          - $ref: '#/components/schemas/855_PURCHASE_ORDER_ACKNOWLEDGMENT'
          - $ref: '#/components/schemas/856_SHIP_NOTICE_MANIFEST'
          - $ref: '#/components/schemas/810_INVOICE'
          - $ref: '#/components/schemas/846_INVENTORY_ADVICE'
          - $ref: '#/components/schemas/860_PURCHASE_ORDER_CHANGE'
    CreateTransactionResponseV4Dto:
      type: object
      required:
      - id
      - status
      - detail
      properties:
        id:
          type: string
          example: '000000'
          description: Transaction id.
        status:
          type: string
          description: Status of the request.
          enum:
          - FAILED
          - ACCEPTED
        detail:
          type: string
          description: Error detail message.
        validationErrors:
          description: Validation errors.
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorDto'
    ValidationErrorDto:
      type: object
      required:
