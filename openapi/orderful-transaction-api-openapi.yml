  /transactions/{transactionId}/deliveries/{deliveryId}:
    get:
      operationId: TransactionController_getDelivery
      summary: Get a Delivery.
      description: Returns the specified transaction delivery. Links to Delivery objects are available in Transactions retrieved from a <a href="https://docs.orderful.com/reference/pollingcontroller_list" target="_blank">Inbox</a> or via an <a href="https://docs.orderful.com/docs/inbound-http" target="_blank">Inbound HTTP Communication Channel</a>.
      tags:
      - Transaction
      parameters:
      - name: transactionId
        required: true
        in: path
        schema:
          type: number
      - name: deliveryId
        required: true
        in: path
        schema:
          type: string
      - name: orderful-api-version
        in: header
        description: Specifies the API version to use.
        schema:
          type: string
          default: v4
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionDeliveryResponseDto'
  /transactions/{transactionId}/deliveries/{deliveryId}/accept:
    post:
      operationId: TransactionController_handleDeliveryApproved
      summary: Accept a transaction delivery.
      description: Accepts the specified transaction delivery. This link is included when a Transaction is retrieved from a <a href="https://docs.orderful.com/reference/inboxcontroller_list" target="_blank">Inbox</a> or via an <a href="https://docs.orderful.com/docs/inbound-http" target="_blank">Inbound HTTP Communication Channel</a>.If this Delivery is the most recent one associated with a Transaction, this will update the Transaction's `deliveryStatus` to `DELIVERED`.If this Delivery is associated with one or more Transactions in a inbox, this will also remove the Transactions from that inbox.
      tags:
      - Transaction
      parameters:
      - name: transactionId
        required: true
        in: path
        schema:
          type: number
      - name: deliveryId
        required: true
        in: path
        schema:
          type: string
      - name: orderful-api-version
        in: header
        description: Specifies the API version to use.
        schema:
          type: string
          default: v4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveTransactionDeliveryRequestV4Dto'
      responses:
        '200':
          description: Transaction delivery marked as accepted.
  /transactions/{transactionId}/deliveries/{deliveryId}/fail:
    post:
      operationId: TransactionController_handleFailDeliveryRequest
      summary: Fail a transaction delivery.
      description: 'Fails the specified transaction delivery. This link is included when a Transaction is retrieved from a <a href="https://docs.orderful.com/reference/pollingcontroller_list" target="_blank">Inbox</a> or via an <a href="https://docs.orderful.com/docs/inbound-http" target="_blank">Inbound HTTP Communication Channel</a>.


        If this Delivery is the most recent one associated with a Transaction, this will update the Transaction''s `deliveryStatus` to `FAILED`.


        If this Delivery is associated with one or more Transactions in a inbox, this will also remove the Transactions from that inbox.

        '
      tags:
      - Transaction
      parameters:
      - name: transactionId
        required: true
        in: path
        schema:
          type: number
      - name: deliveryId
        required: true
        in: path
        schema:
          type: string
      - name: orderful-api-version
        in: header
        description: Specifies the API version to use.
        schema:
          type: string
          default: v4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailTransactionDeliveryRequestV4Dto'
      responses:
        '200':
          description: Transaction marked as failed.
