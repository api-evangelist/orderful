          - return
          - customerPurchase
          - thirdPartyExchange
        palletPhysicalDetails:
          $ref: '#/components/schemas/PhysicalDetails'
        cartons:
          type: array
          items:
            $ref: '#/components/schemas/AsnCarton'
        items:
          type: array
          description: Items directly on pallet (no cartons).
          items:
            $ref: '#/components/schemas/AsnItem'
    POAckLineItem:
      type: object
      description: Line item acknowledgment details.
      properties:
        purchaseOrderLineId:
          type: string
          description: Original PO line item ID.
        productIds:
          $ref: '#/components/schemas/ProductIds'
        productAttributes:
          $ref: '#/components/schemas/ProductAttributes'
        actions:
          type: array
          description: REQUIRED. Actions for this line item.
          items:
            $ref: '#/components/schemas/POAckAction'
    Conditions:
      type: object
      properties:
        type:
          type: string
        description:
          type: string
    InventoryParties:
      type: object
      description: Parties involved in inventory reporting.
      properties:
        inventoryLocation:
          description: Warehouse or distribution center holding inventory.
          allOf:
          - $ref: '#/components/schemas/Party'
        buyer:
          description: Buyer receiving the inventory report.
          allOf:
          - $ref: '#/components/schemas/Party'
        supplier:
          description: Supplier providing the inventory report.
          allOf:
          - $ref: '#/components/schemas/Party'
  securitySchemes:
    API_KEY:
      type: apiKey
      in: header
      name: orderful-api-key
